<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f2f7" />
    <title>Gilas task board</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui.css" />
    <script type="module" src="/client.js"></script>
  </head>
  <body>
    <header class="page-header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">
          <svg class="cherry-icon" viewBox="0 0 48 48" fill="none">
            <path d="M24 18C24 9 18 6 11 6M24 18C25 10 30 7 37 8" stroke="#E8C59B" stroke-width="2.5" stroke-linecap="round" />
            <path d="M24 16C22 23 18 25 16 29M24 16C26 23 30 25 32 29" stroke="#E8C59B" stroke-width="2.5" stroke-linecap="round" />
            <circle cx="15" cy="35" r="8.5" fill="#F8DCE0" />
            <circle cx="33" cy="35" r="8.5" fill="#F8DCE0" />
            <path d="M11.5 32.5C12.2 31.3 13.1 30.8 14.3 30.8" stroke="#FFF7F2" stroke-width="2" stroke-linecap="round" />
            <path d="M29.5 32.5C30.2 31.3 31.1 30.8 32.3 30.8" stroke="#FFF7F2" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
        <div>
          <p class="eyebrow">A calm place to make progress</p>
          <h1>Gilas</h1>
        </div>
      </div>
      <div class="header-actions">
        <div class="display-controls" aria-label="Board appearance">
          <div class="accent-control" role="group" aria-label="Accent colour">
            <span class="accent-label">Accent</span>
            <button class="accent-swatch" type="button" data-accent-choice="blue" aria-label="Blue accent" aria-pressed="true"><span></span></button>
            <button class="accent-swatch" type="button" data-accent-choice="cherry" aria-label="Cherry accent" aria-pressed="false"><span></span></button>
            <button class="accent-swatch" type="button" data-accent-choice="violet" aria-label="Violet accent" aria-pressed="false"><span></span></button>
            <button class="accent-swatch" type="button" data-accent-choice="teal" aria-label="Teal accent" aria-pressed="false"><span></span></button>
            <button class="accent-swatch" type="button" data-accent-choice="amber" aria-label="Amber accent" aria-pressed="false"><span></span></button>
          </div>
          <span class="control-divider" aria-hidden="true"></span>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="10" cy="10" r="3.25" stroke="currentColor" stroke-width="1.5" />
              <path d="M10 1.75v2M10 16.25v2M18.25 10h-2M3.75 10h-2m14.08-5.83-1.42 1.42M5.59 14.41l-1.42 1.42m11.66 0-1.42-1.42M5.59 5.59 4.17 4.17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M16.7 12.2A7 7 0 0 1 7.8 3.3a7.1 7.1 0 1 0 8.9 8.9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
            <span id="theme-toggle-label">Light</span>
          </button>
        </div>
        <div class="source-card">
          <span class="live-dot" id="connection-dot" aria-hidden="true"></span>
          <div>
            <p class="source-label">Watching</p>
            <p class="source-name" id="source-name">Loading task file…</p>
            <p class="connection-status" id="connection-status" role="status" aria-live="polite">
              Connecting to the board
            </p>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="board-heading" aria-labelledby="board-title">
        <div>
          <p class="eyebrow">Your work, at a glance</p>
          <h2 id="board-title">Task board</h2>
        </div>
        <p class="last-updated" id="last-updated"></p>
      </section>
      <div class="board" id="board" aria-live="polite" aria-busy="true"></div>
      <section class="warnings" id="warnings" hidden aria-labelledby="warnings-title">
        <h2 id="warnings-title">A few rows need attention</h2>
        <ul id="warning-list"></ul>
      </section>
    </main>
    <footer class="page-footer">
      <span>Gilas · plain Markdown, always yours</span>
      <span class="footer-cherry" aria-hidden="true">✳</span>
    </footer>
  </body>
</html>
